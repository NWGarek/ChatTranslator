[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-translator"
version = "0.1.0"
description = "Turns a Chatbase export into a spreadsheet staff can read in Dutch."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "ollama>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.setuptools]
packages = ["chat_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: runs the real local model (slow); run with -m ollama"]
addopts = "-m 'not ollama'"

[tool.mypy]
strict = true
files = ["chat_translator", "tests"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
